services:
  directus:
    image: directus/directus:latest
    container_name: medusa-directus-cms
    ports:
      - "8055:8055"
    environment:
      KEY: "medusa-directus-secret-key-12345"
      SECRET: "medusa-directus-jwt-secret-67890"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "admin"
      DB_CLIENT: "sqlite3"
      DB_FILENAME: "/directus/database/data.db"
      WEBSOCKETS_ENABLED: "true"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"
    volumes:
      - ./directus-data/database:/directus/database
      - ./directus-data/uploads:/directus/uploads
      - ./directus-data/extensions:/directus/extensions
    restart: unless-stopped
